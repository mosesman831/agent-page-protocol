<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APP demo sites</title>
    <link rel="stylesheet" href="/extension/assets/styles.css" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0e1115;
        color: #e8eaed;
      }
      #picker {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 14px;
        background: #171b22;
        border-bottom: 1px solid #2a3038;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      #picker strong {
        margin-right: 8px;
      }
      #picker a {
        color: #8ab4f8;
        text-decoration: none;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 13px;
      }
      #picker a:hover {
        background: #232a34;
      }
      #picker a.active {
        background: #2b3a4f;
        color: #fff;
      }
      #picker .sep {
        width: 1px;
        height: 20px;
        background: #2a3038;
        margin: 0 6px;
      }
      #host {
        padding: 18px;
        max-width: 1180px;
        margin: 0 auto;
      }
      #raw {
        font-size: 12px;
        color: #8b949e;
        padding: 0 14px 14px;
      }
      #raw a {
        color: #8ab4f8;
      }
    </style>
  </head>
  <body class="app-view-page">
    <nav id="picker"></nav>
    <div id="raw"></div>
    <div id="host"></div>
    <script type="module" src="/demo/viewer.js"></script>
  </body>
</html>
